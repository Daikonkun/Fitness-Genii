name: CI and Deployment Guard

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Public deployment URL to smoke-test after application QA
        required: false
        type: string

jobs:
  command-entrypoint-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate command entrypoint references
        run: bash scripts/check-command-entrypoints.sh

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate generated docs sync
        run: bash scripts/check-docs-sync.sh

  application-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run type checks against generated route types
        run: npm run typecheck

  deployment-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_url != ''
    needs: application-qa
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test deployment
        run: npm run smoke -- "$DEPLOYMENT_URL"
